name: LineMap release preflight

on:
  pull_request:
  push:
    branches:
      - codex/release-readiness-2026-09-13

permissions:
  contents: read

jobs:
  static-release-preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify immutable GitHub Action pins
        shell: python
        run: |
          from pathlib import Path
          import re

          action_ref = re.compile(r"^\s*uses:\s+([^@\s]+)@([^\s#]+)", re.MULTILINE)
          sha = re.compile(r"^[0-9a-fA-F]{40}$")
          violations = []
          for workflow in sorted(Path(".github/workflows").glob("*.y*ml")):
              for action, ref in action_ref.findall(workflow.read_text(encoding="utf-8")):
                  if action.startswith("./"):
                      continue
                  if not sha.fullmatch(ref):
                      violations.append(f"{workflow}: {action}@{ref}")
          if violations:
              raise SystemExit("Mutable GitHub Action refs are forbidden:\n" + "\n".join(violations))
          print("PASS: all external GitHub Actions are pinned to immutable commit SHAs")
      - name: Use Python 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run deterministic release preflight
        run: python scripts/release_preflight.py
      - name: Verify repository remains static-only
        shell: bash
        run: |
          set -euo pipefail
          test ! -e package.json
          test ! -e node_modules
          echo "PASS: no package/runtime dependency surface introduced"
      - name: Build exact static release artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifact
          cp index.html release-artifact/index.html
          (
            cd release-artifact
            sha256sum index.html > SHA256SUMS
          )
          {
            echo "repository=PRISMqd/LineMap"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "artifact=index.html"
          } > release-artifact/PROVENANCE.txt
          cat release-artifact/SHA256SUMS
          cat release-artifact/PROVENANCE.txt
      - name: Upload exact static release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linemap-static-${{ github.sha }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 30
